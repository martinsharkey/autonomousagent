version: '3.8'

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: autonomous-sandbox
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:nosuid,noexec,nodev,size=64m
      - /tmp/sandbox_workspace:nosuid,noexec,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - sandbox-network
    restart: "no"

networks:
  sandbox-network:
    driver: bridge
    internal: true
